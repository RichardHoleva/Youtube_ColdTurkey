<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Focus Lock</title>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/timeline.css">
    <link rel="stylesheet" href="styles/schedule-form.css">
    <link rel="stylesheet" href="styles/confirm-dialog.css">
    <link rel="stylesheet" href="settings/drawer.css">
    <link rel="stylesheet" href="settings/options.css">
    <link rel="stylesheet" href="theme/theme-switch.css">
    <script src="../shared/theme.js"></script>
    <script src="theme/theme-init.js"></script>
    <script src="../shared/schedule.js"></script>
    <script src="../shared/options.js"></script>
    <script type="module" src="main.js"></script>
  </head>
  <body data-state="loading" data-drawer="closed">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="icon-lock" viewBox="0 0 16 16" fill="none">
        <rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5.25 7V5a2.75 2.75 0 0 1 5.5 0v2" stroke="currentColor" stroke-width="1.5"/>
      </symbol>
    </svg>

    <main>
      <header class="topbar">
        <div class="topbar-start">
          <button type="button" class="drawer-button" id="drawer-open" aria-expanded="false" aria-controls="block-drawer" aria-label="Choose what to block" title="Choose what to block">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 4h14M1 8h8.5M1 12h11"/></svg>
          </button>
          <span class="brand">Focus Lock</span>
        </div>
        <div class="topbar-end">
          <time class="clock" id="clock"><span class="clock-dot" aria-hidden="true"></span><span id="clock-time">--:--</span></time>
          <button type="button" class="theme-switch" role="switch" aria-checked="false" aria-label="Dark mode" title="Switch to dark mode">
            <span class="theme-thumb" aria-hidden="true"></span>
            <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
              <circle cx="12" cy="12" r="4.5"/>
              <path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
            </svg>
            <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.7 6.7 0 0 0 10.7 10.7z"/>
            </svg>
          </button>
        </div>
      </header>

      <h1 class="headline" id="headline">
        <span class="headline-line" id="headline-lead">Loading</span>
        <span class="headline-line"><span id="headline-prefix">schedule…</span><span class="headline-time" id="headline-time" hidden></span><span id="headline-dot" hidden>.</span></span>
      </h1>

      <section class="timeline" id="timeline" role="img" aria-label="24-hour timeline">
        <div class="timeline-scale">
          <span class="timeline-base"></span>
          <span class="timeline-bar" hidden></span>
          <span class="timeline-bar" hidden></span>
          <span class="timeline-ticks" id="timeline-ticks" aria-hidden="true"></span>
          <span class="timeline-now" id="timeline-now"></span>
        </div>
        <div class="timeline-labels" aria-hidden="true">
          <span style="--at: 0">00</span><span style="--at: .25">06</span><span style="--at: .5">12</span><span style="--at: .75">18</span><span style="--at: 1">24</span>
        </div>
      </section>

      <form class="schedule" id="schedule-form" novalidate>
        <div class="field">
          <label for="start">From</label>
          <input type="text" id="start" name="start" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="5" placeholder="HH:mm" required disabled>
          <span class="time-value" id="start-value" hidden></span>
        </div>
        <div class="field">
          <label for="end">To</label>
          <input type="text" id="end" name="end" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="5" placeholder="HH:mm" required disabled>
          <span class="time-value" id="end-value" hidden></span>
        </div>
        <div class="action">
          <button id="save" class="btn" type="submit" disabled>Save</button>
          <p class="lock-status" id="lock-status" hidden><svg class="icon" width="14" height="14" aria-hidden="true"><use href="#icon-lock"/></svg>Locked</p>
        </div>
      </form>
      <p class="message" id="form-message" role="status" aria-live="polite"></p>
    </main>

    <aside class="drawer" id="block-drawer" aria-labelledby="drawer-title" inert>
      <header class="topbar">
        <div class="topbar-start">
          <button type="button" class="drawer-button" id="drawer-close" aria-label="Close" title="Close">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 8H2M6.5 3.5 2 8l4.5 4.5"/></svg>
          </button>
          <span class="brand">Focus Lock</span>
        </div>
        <span class="options-lock" aria-hidden="true"><svg class="icon" width="14" height="14"><use href="#icon-lock"/></svg>Locked</span>
      </header>

      <h2 class="headline drawer-headline" id="drawer-title">
        <span class="headline-line">Also</span>
        <span class="headline-line">block.</span>
      </h2>
      <p class="drawer-lead">Hidden on YouTube only while focus is on.</p>

      <div class="options" role="group" aria-label="Also block">
        <label class="option">
          <input class="option-input" type="checkbox" role="switch" data-option="shorts">
          <span class="option-name">Shorts</span>
          <span class="option-state" aria-hidden="true"></span>
          <span class="toggle" aria-hidden="true">
            <span class="toggle-track"></span><span class="toggle-bar"></span><span class="toggle-ticks"></span><span class="toggle-cursor"></span>
          </span>
        </label>
        <label class="option">
          <input class="option-input" type="checkbox" role="switch" data-option="subscriptions">
          <span class="option-name">Subscriptions</span>
          <span class="option-state" aria-hidden="true"></span>
          <span class="toggle" aria-hidden="true">
            <span class="toggle-track"></span><span class="toggle-bar"></span><span class="toggle-ticks"></span><span class="toggle-cursor"></span>
          </span>
        </label>
      </div>
      <p class="message" id="drawer-message" role="status" aria-live="polite"></p>
    </aside>

    <dialog class="confirm" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body confirm-lock-text">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <p class="confirm-lock"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#icon-lock"/></svg><span id="confirm-lock-text"></span></p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-secondary" id="confirm-cancel" autofocus>Go back</button>
        <button type="button" class="btn" id="confirm-continue">Continue</button>
      </div>
    </dialog>
  </body>
</html>
